<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Student Planner | Multi-User</title>
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <link href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)" rel="stylesheet">
    <script src="[https://cdn.jsdelivr.net/npm/chart.js](https://cdn.jsdelivr.net/npm/chart.js)"></script>
    
    <!-- Firebase SDKs -->
    <script src="[https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js](https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js)"></script>
    <script src="[https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js](https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js)"></script>
    <script src="[https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js](https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js)"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-950 text-gray-100 flex h-screen overflow-hidden font-prompt relative">

    <!-- ================= LOGIN SCREEN ================= -->
    <div id="loginScreen" class="absolute inset-0 bg-gray-950 z-50 flex items-center justify-center p-4 transition-opacity duration-500">
        <div class="bg-gray-900 border border-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md relative">
            <button onclick="toggleLanguage()" class="absolute top-4 right-4 text-gray-400 hover:text-white bg-gray-800 px-3 py-1 rounded-lg text-sm transition font-bold" id="langBtnLogin">🇹🇭 TH</button>
            <div class="text-center mb-8 mt-4">
                <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-3xl font-bold shadow-lg shadow-indigo-500/30 mb-4">
                    <i class="fa-solid fa-code text-white"></i>
                </div>
                <h2 class="text-2xl font-bold text-white">DEV PLANNER</h2>
                <p class="text-gray-400 text-sm mt-1" data-i18n="loginSubtitle">Sign in to manage your workspace</p>
            </div>
            
            <form id="authForm" class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1" data-i18n="email">Email</label>
                    <input type="email" id="email" required class="w-full bg-gray-800 border border-gray-700 text-white rounded-lg p-3 outline-none focus:border-indigo-500 transition">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1" data-i18n="password">Password</label>
                    <input type="password" id="password" required class="w-full bg-gray-800 border border-gray-700 text-white rounded-lg p-3 outline-none focus:border-indigo-500 transition">
                </div>
                <div class="flex gap-4 pt-4">
                    <button type="button" onclick="login()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-lg transition" data-i18n="loginBtn">Login</button>
                    <button type="button" onclick="register()" class="flex-1 bg-gray-800 hover:bg-gray-700 border border-gray-700 text-white font-bold py-3 rounded-lg transition" data-i18n="registerBtn">Register</button>
                </div>
                <p id="authError" class="text-red-400 text-xs text-center mt-2 hidden"></p>
            </form>
        </div>
    </div>

    <!-- ================= MAIN APP ================= -->
    <div id="mainApp" class="w-full h-full flex hidden opacity-0 transition-opacity duration-500 relative">
        
        <!-- Mobile Overlay (ฉากหลังเบลอเวลากดเมนูมือถือ) -->
        <div id="mobileOverlay" onclick="toggleMobileMenu()" class="fixed inset-0 bg-gray-950/80 backdrop-blur-sm z-30 hidden opacity-0 transition-opacity duration-300 md:hidden"></div>

        <!-- Sidebar (อัปเดตให้สไลด์บนมือถือได้) -->
        <aside id="sidebar" class="fixed md:static inset-y-0 left-0 w-72 bg-gray-950 border-r border-gray-800 flex flex-col z-40 transform -translate-x-full md:translate-x-0 transition-transform duration-300 shadow-2xl md:shadow-none">
            <div class="p-6 border-b border-gray-800 flex items-center justify-between gap-4">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-xl font-bold">
                        <i class="fa-solid fa-code"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-400">DEV PLANNER</h1>
                        <p class="text-xs text-gray-500 truncate w-32" id="userDisplay">User</p>
                    </div>
                </div>
                <!-- ปุ่มปิดเมนูบนมือถือ -->
                <button onclick="toggleMobileMenu()" class="md:hidden text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <nav class="flex-1 p-4 space-y-2 overflow-y-auto custom-scrollbar" id="sidebarNav"></nav>
            <div class="p-4 border-t border-gray-800">
                <button onclick="logout()" class="w-full flex items-center justify-center gap-2 text-gray-400 hover:text-red-400 hover:bg-red-400/10 py-3 rounded-lg transition">
                    <i class="fa-solid fa-right-from-bracket"></i> <span data-i18n="logout">Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col h-screen overflow-y-auto relative bg-gray-900 w-full">
            <header class="bg-gray-900/80 backdrop-blur-md border-b border-gray-800 p-4 md:p-6 flex justify-between items-center sticky top-0 z-10">
                <div class="flex items-center gap-4">
                    <!-- Hamburger Menu สำหรับมือถือ -->
                    <button onclick="toggleMobileMenu()" class="md:hidden text-gray-400 hover:text-white text-2xl transition transform hover:scale-110">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <h2 class="text-xl md:text-2xl font-bold tracking-wide" data-i18n="overview">Overview</h2>
                </div>
                <div class="flex items-center gap-2 md:gap-4">
                    <button onclick="toggleLanguage()" class="text-gray-400 hover:text-white bg-gray-800 px-3 py-2 rounded-lg text-xs md:text-sm transition font-bold" id="langBtnMain">🇹🇭 TH</button>
                    <button onclick="toggleModal(true)" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 md:px-5 py-2 md:py-2.5 rounded-lg font-medium shadow-lg shadow-indigo-600/20 transition-all flex items-center gap-2 transform hover:scale-105 text-sm md:text-base">
                        <i class="fa-solid fa-plus"></i> <span class="hidden md:inline" data-i18n="newTask">New Task</span>
                    </button>
                </div>
            </header>

            <div class="p-4 md:p-6 lg:p-8 space-y-6 md:space-y-8 fade-in">
                <!-- Stats Row -->
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                    <div class="stat-card bg-gray-800 p-4 md:p-6 rounded-2xl border border-gray-700 relative overflow-hidden"><p class="text-gray-400 text-xs md:text-sm font-medium uppercase tracking-wider truncate" data-i18n="totalTasks">Total</p><h3 class="text-2xl md:text-4xl font-bold text-white mt-1 md:mt-2" id="statTotal">0</h3></div>
                    <div class="stat-card bg-gray-800 p-4 md:p-6 rounded-2xl border border-gray-700 relative overflow-hidden"><p class="text-amber-400 text-xs md:text-sm font-medium uppercase tracking-wider truncate" data-i18n="pending">Pending</p><h3 class="text-2xl md:text-4xl font-bold text-white mt-1 md:mt-2" id="statPending">0</h3></div>
                    <div class="stat-card bg-gray-800 p-4 md:p-6 rounded-2xl border border-red-900/50 relative overflow-hidden"><p class="text-red-400 text-xs md:text-sm font-medium uppercase tracking-wider truncate" data-i18n="urgent">Urgent</p><h3 class="text-2xl md:text-4xl font-bold text-white mt-1 md:mt-2" id="statUrgent">0</h3></div>
                    <div class="stat-card bg-gray-800 p-4 md:p-6 rounded-2xl border border-gray-700 relative overflow-hidden"><p class="text-emerald-400 text-xs md:text-sm font-medium uppercase tracking-wider truncate" data-i18n="completed">Done</p><h3 class="text-2xl md:text-4xl font-bold text-white mt-1 md:mt-2" id="statDone">0</h3></div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 md:gap-6">
                    <div class="lg:col-span-2 bg-gray-800 rounded-2xl border border-gray-700 overflow-hidden flex flex-col">
                        <div class="p-4 md:p-5 border-b border-gray-700 bg-gray-800/50 flex justify-between items-center"><h3 class="text-base md:text-lg font-bold"><i class="fa-solid fa-list-check text-indigo-400 mr-2"></i> <span data-i18n="activeWorkload">Active Workload</span></h3></div>
                        <!-- ตารางเลื่อนซ้ายขวาได้บนมือถือ (overflow-x-auto) -->
                        <div class="overflow-x-auto flex-1 custom-scrollbar">
                            <table class="w-full text-left border-collapse min-w-[600px]">
                                <thead><tr class="bg-gray-950 text-gray-400 text-xs uppercase tracking-wider"><th class="p-4" data-i18n="subject">Subject</th><th class="p-4" data-i18n="task">Task</th><th class="p-4" data-i18n="deadline">Deadline</th><th class="p-4 text-center" data-i18n="status">Status</th><th class="p-4 text-center" data-i18n="action">Action</th></tr></thead>
                                <tbody id="taskTableBody" class="text-sm divide-y divide-gray-700/50"></tbody>
                            </table>
                        </div>
                    </div>
                    <div class="bg-gray-800 rounded-2xl border border-gray-700 p-4 md:p-6 flex flex-col items-center justify-center">
                        <h3 class="text-base md:text-lg font-bold self-start w-full mb-4"><i class="fa-solid fa-chart-pie text-purple-400 mr-2"></i> <span data-i18n="chartTitle">Tasks by Subject</span></h3>
                        <div class="w-full max-w-[200px] md:max-w-[250px] relative"><canvas id="subjectChart"></canvas></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal (Popup สร้างงาน ปรับให้พอดีมือถือ) -->
    <div id="taskModal" class="fixed inset-0 bg-gray-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center opacity-0 transition-opacity duration-300 p-4">
        <div class="bg-gray-900 border border-gray-700 rounded-2xl w-full max-w-md p-6 shadow-2xl transform scale-95 transition-transform duration-300" id="modalContent">
            <div class="flex justify-between items-center mb-6"><h3 class="text-lg md:text-xl font-bold text-white" data-i18n="modalTitle">Create New Task</h3><button onclick="toggleModal(false)" class="text-gray-400 hover:text-white p-2"><i class="fa-solid fa-xmark text-xl"></i></button></div>
            <form id="taskForm" class="space-y-4">
                <div><label class="block text-sm font-medium text-gray-400 mb-1" data-i18n="subject">Subject</label><select id="inputSubject" required class="w-full bg-gray-800 border border-gray-700 text-white rounded-lg p-3 outline-none focus:border-indigo-500"></select></div>
                <div><label class="block text-sm font-medium text-gray-400 mb-1" data-i18n="taskName">Task Name</label><input type="text" id="inputTask" required class="w-full bg-gray-800 border border-gray-700 text-white rounded-lg p-3 outline-none focus:border-indigo-500"></div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div><label class="block text-sm font-medium text-gray-400 mb-1" data-i18n="deadline">Deadline</label><input type="date" id="inputDate" required class="w-full bg-gray-800 border border-gray-700 text-gray-300 rounded-lg p-3 outline-none focus:border-indigo-500 [color-scheme:dark]"></div>
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-1" data-i18n="priority">Priority</label>
                        <select id="inputPriority" class="w-full bg-gray-800 border border-gray-700 text-white rounded-lg p-3 outline-none focus:border-indigo-500">
                            <option value="Normal" data-i18n="optNormal">🟢 Normal</option>
                            <option value="Urgent" data-i18n="optUrgent">🔴 Urgent</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold rounded-lg p-3 md:p-4 mt-6 shadow-lg transition" data-i18n="btnSave">Save Task</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
